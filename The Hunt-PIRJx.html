<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Jack The Pirate King — PIRJx: Cannon Raiders</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#ffe08a;font-family:Georgia,serif}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 35%,#12304b 0,#07131f 45%,#020509 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:min(1100px,94vw);display:flex;justify-content:space-between;gap:10px;pointer-events:none;z-index:5}
.panel{background:linear-gradient(180deg,rgba(25,15,5,.88),rgba(5,7,10,.88));border:1px solid #dcae43;border-radius:10px;padding:8px 13px;box-shadow:0 0 18px rgba(255,190,50,.16),inset 0 0 12px rgba(255,220,120,.05);text-shadow:0 1px 2px #000}
.title{font-size:clamp(12px,1.5vw,18px);font-weight:bold;letter-spacing:2px}
.stat{font-size:clamp(11px,1.3vw,16px)}
#message{position:absolute;top:15%;left:50%;transform:translateX(-50%);z-index:7;text-align:center;pointer-events:none;text-shadow:0 3px 12px #000}
#message h1{margin:0;color:#ffd65c;font-size:clamp(32px,6vw,78px);letter-spacing:5px}
#message p{margin:8px;font-size:clamp(14px,2vw,22px);color:#fff1c4}
#start{position:absolute;z-index:8;left:50%;top:62%;transform:translate(-50%,-50%);padding:15px 30px;border:2px solid #f2c85c;border-radius:12px;background:linear-gradient(#6d3510,#251006);color:#ffe99a;font:bold 20px Georgia;cursor:pointer;box-shadow:0 0 30px #c78322}
#start:hover{filter:brightness(1.25)}
#controls{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);z-index:6;text-align:center;font-size:12px;color:#d7c89c;opacity:.85}
#logo{position:absolute;right:15px;bottom:15px;width:72px;height:72px;border-radius:50%;opacity:.75;border:2px solid #dcae43;object-fit:cover;z-index:6}
#touch{display:none;position:absolute;inset:auto 0 8px 0;z-index:9;justify-content:center;gap:12px}
.tbtn{width:76px;height:58px;border:2px solid #c9973e;border-radius:13px;background:rgba(30,15,5,.85);color:#ffe28a;font:bold 22px Georgia}
@media(max-width:700px){#hud{top:5px}.panel{padding:5px 8px}.stat{font-size:11px}#controls{display:none}#touch{display:flex}}
</style>
</head>

<div id="wrap">
<canvas id="game"></canvas>
<div id="hud">
  <div class="panel title">☠ JACK THE PIRATE KING • PIRJx</div>

</div>
<div id="message">

  <p>Sink the enemy fleet. Claim the treasure. Become Pirate King.</p>
</div>
<button id="start">⚓ SET SAIL</button>
<div id="controls">← / → or A / D to steer &nbsp; • &nbsp; SPACE to fire cannons &nbsp; • &nbsp; P to pause</div>
<div id="touch"><button class="tbtn" id="left">◀</button><button class="tbtn" id="fire">💥</button><button class="tbtn" id="right">▶</button></div>
<img id="logo" alt="PIRJx logo">
</div>

let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

const keys={left:false,right:false,fire:false};
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left=true;
  if(e.code==='ArrowRight'||e.code==='KeyD') keys.right=true;
  if(e.code==='Space') keys.fire=true;
  if(e.code==='KeyP' && game.running) game.paused=!game.paused;
});
addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left=false;
  if(e.code==='ArrowRight'||e.code==='KeyD') keys.right=false;
  if(e.code==='Space') keys.fire=false;
});
function bind(id,key){let b=document.getElementById(id);['pointerdown'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[key]=true}));['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[key]=false}))}
bind('left','left');bind('right','right');bind('fire','fire');

let audio;
function initAudio(){ if(audio)return; audio=new (window.AudioContext||window.webkitAudioContext)(); }
function beep(freq,dur,type='square',vol=.04,slide=0){
  if(!audio)return; const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;
  o.frequency.linearRampToValueAtTime(Math.max(40,freq+slide),audio.currentTime+dur);
  g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);
  o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur);
}
function cannonSound(){beep(90,.11,'sawtooth',.08,-50);setTimeout(()=>beep(45,.16,'square',.04,-10),15)}
function boomSound(){beep(70,.28,'sawtooth',.09,-60);setTimeout(()=>beep(35,.3,'triangle',.05,-5),20)}
function coinSound(){beep(620,.08,'square',.04,150);setTimeout(()=>beep(930,.12,'square',.03,100),80)}

const game={running:false,paused:false,level:1,score:0,lives:3,gold:0,spawn:0,boss:null};
const player={x:W/2,y:0,speed:470,cool:0,inv:0};
let bullets=[],enemies=[],particles=[],coins=[],waves=[],stars=[];

for(let i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.3,a:Math.random()*.6+.15});
for(let i=0;i<8;i++)waves.push({x:Math.random()*W,y:Math.random()*H,off:Math.random()*6});

function reset(){
  game.level=1;game.score=0;game.lives=3;game.gold=0;game.spawn=0;game.boss=null;
  bullets=[];enemies=[];particles=[];coins=[];player.x=W/2;player.inv=2;
}
function startGame(){initAudio();audio?.resume();reset();game.running=true;game.paused=false;document.getElementById('start').style.display='none';document.getElementById('message').style.display='none';last=performance.now();requestAnimationFrame(loop)}
document.getElementById('start').onclick=startGame;

function txt(t,x,y,size,fill='#ffe08a',align='center'){ctx.font=`bold ${size}px Georgia`;ctx.textAlign=align;ctx.fillStyle=fill;ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.fillText(t,x,y);ctx.shadowBlur=0}

function drawSea(t){
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#020a13');g.addColorStop(.45,'#07304b');g.addColorStop(1,'#031018');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.6;
  for(const s of stars){s.y+=.03;if(s.y>H)s.y=0;ctx.fillStyle=`rgba(255,220,140,${s.a})`;ctx.fillRect(s.x,s.y,s.s,s.s)}
  ctx.globalAlpha=1;
  // moon
  ctx.beginPath();ctx.arc(W*.82,H*.16,Math.min(W,H)*.07,0,Math.PI*2);ctx.fillStyle='#f8e8b0';ctx.shadowColor='#ffe49a';ctx.shadowBlur=25;ctx.fill();ctx.shadowBlur=0;
  // distant islands
  ctx.fillStyle='#071015';ctx.beginPath();ctx.moveTo(0,H*.48);for(let x=0;x<=W;x+=90)ctx.lineTo(x,H*.48-25-Math.sin(x*.011)*25);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  // wave bands
  ctx.strokeStyle='rgba(100,190,215,.17)';ctx.lineWidth=2;
  for(let y=H*.48;y<H;y+=45){ctx.beginPath();for(let x=0;x<=W;x+=18)ctx.lineTo(x,y+Math.sin(x*.02+t*.001+y)*4);ctx.stroke()}
}

function drawShip(x,y,scale,enemy=false,boss=false){
  ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
  // wake
  ctx.strokeStyle='rgba(220,245,255,.28)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-45,20);ctx.quadraticCurveTo(0,34,45,20);ctx.stroke();
  // hull
  ctx.fillStyle=enemy?(boss?'#350b0b':'#27150e'):'#211006';ctx.strokeStyle='#c9943c';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-46,-3);ctx.lineTo(-38,25);ctx.quadraticCurveTo(0,39,38,25);ctx.lineTo(46,-3);ctx.closePath();ctx.fill();ctx.stroke();
  // deck
  ctx.fillStyle='#6d3e18';ctx.fillRect(-39,-9,78,9);
  // mast
  ctx.strokeStyle='#8c5b2a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(0,-72);ctx.stroke();
  // sails
  ctx.fillStyle=enemy?'#201c1a':'#efe0b4';ctx.strokeStyle='#b78636';
  ctx.beginPath();ctx.moveTo(4,-66);ctx.quadraticCurveTo(35,-55,42,-18);ctx.lineTo(4,-18);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-4,-61);ctx.quadraticCurveTo(-28,-50,-35,-20);ctx.lineTo(-4,-20);ctx.closePath();ctx.fill();ctx.stroke();
  // flag
  ctx.fillStyle='#080809';ctx.fillRect(0,-78,30,19);txt('☠',15,-63,14,'#d9b45a');
  // cannon ports
  ctx.fillStyle='#050505';for(let i=-25;i<=25;i+=13){ctx.beginPath();ctx.arc(i,1,3,0,Math.PI*2);ctx.fill()}
  ctx.restore();
}

function drawPlayer(){ if(player.inv>0 && Math.floor(player.inv*12)%2===0)return;drawShip(player.x,player.y,1.05,false,false) }

function spawnEnemy(){
  const edge=70, type=Math.random()<.18+game.level*.015?'fast':Math.random()<.15?'tank':'normal';
  enemies.push({x:edge+Math.random()*(W-edge*2),y:-90,v:65+game.level*10+(type==='fast'?55:0),hp:type==='tank'?3:1,max:type==='tank'?3:1,type,w:55,h:75,phase:Math.random()*6});
}
function spawnBoss(){
  game.boss={x:W/2,y:-150,v:40,hp:20+game.level*5,max:20+game.level*5,cool:1.2,phase:0};
  enemies=[];
  document.getElementById('message').style.display='block';
  document.querySelector('#message h1').textContent='☠ CAPTAIN BOSS ☠';
  document.querySelector('#message p').textContent='Sink the flagship to claim the level treasure!';
  setTimeout(()=>document.getElementById('message').style.display='none',1700);
}
function fire(){
  if(player.cool>0)return;player.cool=.23;cannonSound();
  bullets.push({x:player.x,y:player.y-72,v:-720,enemy:false,life:2});
}
function enemyFire(e){bullets.push({x:e.x,y:e.y+30,v:220,enemy:true,life:4})}

function burst(x,y,n=20,hot=true){
  for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=Math.random()*260+40;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+Math.random()*.7,r:2+Math.random()*5,hot})}
  boomSound();
}
function addCoin(x,y,n=1){for(let i=0;i<n;i++)coins.push({x:x+(Math.random()-.5)*40,y:y+(Math.random()-.5)*25,vy:-20-Math.random()*60,spin:Math.random()*6})}

function hitPlayer(){
  if(player.inv>0)return;game.lives--;player.inv=2;burst(player.x,player.y,35);
  if(game.lives<=0){game.running=false;document.getElementById('start').style.display='block';document.getElementById('start').textContent='☠ PLAY AGAIN';document.getElementById('message').style.display='block';document.querySelector('#message h1').textContent='SHIP LOST';document.querySelector('#message p').textContent=`Final score: ${game.score.toLocaleString()} • Treasure: ${game.gold} gold`;}
}
function update(dt,t){
  if(game.paused)return;
  player.y=H-95;player.cool=Math.max(0,player.cool-dt);player.inv=Math.max(0,player.inv-dt);
  if(keys.left)player.x-=player.speed*dt;if(keys.right)player.x+=player.speed*dt;player.x=Math.max(60,Math.min(W-60,player.x));
  if(keys.fire)fire();
  game.spawn-=dt;
  const target=Math.max(.38,1.35-game.level*.07);
  if(!game.boss && game.spawn<=0){spawnEnemy();game.spawn=target}
  if(!game.boss && game.score>0 && game.score%(Math.max(120,game.level*180))<2){/* scoring handled below */}
  if(!game.boss && game.level%3===0 && enemies.length===0 && game.spawn<0)spawnBoss();

  for(const e of enemies){e.y+=e.v*dt;e.x+=Math.sin(t*.001+e.phase)*35*dt;if(Math.random()<dt*(.22+game.level*.03))enemyFire(e);if(e.y>H+90)e.dead=true;if(Math.abs(e.x-player.x)<55&&Math.abs(e.y-player.y)<65){e.dead=true;hitPlayer()}}
  if(game.boss){
    let b=game.boss;b.phase+=dt;b.y=Math.min(H*.25,b.y+b.v*dt);b.x=W/2+Math.sin(b.phase*.8)*W*.32;b.cool-=dt;
    if(b.cool<=0){enemyFire(b);enemyFire({...b,x:b.x-50});enemyFire({...b,x:b.x+50});b.cool=Math.max(.45,1.15-game.level*.04)}
    if(Math.abs(b.x-player.x)<85&&Math.abs(b.y-player.y)<75)hitPlayer();
  }
  for(const b of bullets){b.y+=b.v*dt;b.life-=dt;
    if(!b.enemy){for(const e of enemies){if(!e.dead&&Math.abs(b.x-e.x)<42&&Math.abs(b.y-e.y)<55){e.hp--;b.life=0;burst(b.x,b.y,8,false);if(e.hp<=0){e.dead=true;game.score+=e.type==='tank'?80:50;game.gold+=e.type==='tank'?3:1;addCoin(e.x,e.y,e.type==='tank'?3:1);if(game.score%250<60)coinSound()}}}
      if(game.boss&&!b.dead&&Math.abs(b.x-game.boss.x)<75&&Math.abs(b.y-game.boss.y)<90){game.boss.hp--;b.life=0;burst(b.x,b.y,10,false);if(game.boss.hp<=0){game.score+=1000;game.gold+=25;addCoin(game.boss.x,game.boss.y,12);burst(game.boss.x,game.boss.y,90);game.boss=null;game.level++;document.getElementById('message').style.display='block';document.querySelector('#message h1').textContent='TREASURE CLAIMED!';document.querySelector('#message p').textContent=`Level ${game.level} begins — the seas grow more dangerous!`;setTimeout(()=>document.getElementById('message').style.display='none',1500)}}}
    else if(Math.abs(b.x-player.x)<45&&Math.abs(b.y-player.y)<60){b.life=0;hitPlayer()}
  }
  bullets=bullets.filter(b=>b.life>0&&b.y>-100&&b.y<H+100);
  enemies=enemies.filter(e=>!e.dead);
  for(const c of coins){c.y+=c.vy*dt;c.vy+=100*dt;c.spin+=dt*8;if(Math.abs(c.x-player.x)<45&&Math.abs(c.y-player.y)<55){c.dead=true;game.gold++;coinSound()}}
  coins=coins.filter(c=>!c.dead&&c.y<H+50);
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.life-=dt;p.r*=.995}
  particles=particles.filter(p=>p.life>0);
}

function draw(t){
  drawSea(t);
  // cannon flashes / projectiles
  for(const b of bullets){ctx.save();ctx.shadowColor=b.enemy?'#ff3c20':'#ffe08a';ctx.shadowBlur=14;ctx.fillStyle=b.enemy?'#ff6a32':'#fff1a5';ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill();ctx.restore()}
  for(const e of enemies)drawShip(e.x,e.y,e.type==='tank'?1.2:.85,true,false);
  if(game.boss){drawShip(game.boss.x,game.boss.y,1.8,true,true);ctx.fillStyle='#210';ctx.fillRect(W*.25,70,W*.5,10);ctx.fillStyle='#e0a72d';ctx.fillRect(W*.25,70,W*.5*(game.boss.hp/game.boss.max),10);txt('FLAGSHIP HP',W/2,67,12)}
  drawPlayer();
  for(const c of coins){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(Math.sin(c.spin)*.4);ctx.fillStyle='#f7c94f';ctx.strokeStyle='#8c5a17';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();ctx.stroke();txt('P',0,5,10,'#75480b');ctx.restore()}
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.hot?(Math.random()<.5?'#ff7a22':'#ffd34d'):'#b8e9ff';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
  document.getElementById('lvl').textContent=game.level;document.getElementById('score').textContent=game.score.toLocaleString();document.getElementById('lives').textContent=game.lives;document.getElementById('gold').textContent=game.gold;
}

let last=performance.now();
function loop(t){if(!game.running)return;let dt=Math.min(.033,(t-last)/1000);last=t;update(dt,t);draw(t);requestAnimationFrame(loop)}
drawSea(0);draw(0);
</script>
</body>
</html>
